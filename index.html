<script>
window.DM_CONFIG = {

<script>
/* ============================================================================
   لایهٔ ابری — اتصال از طریق Supabase + لایسنس (منبع اصلی داده)
   ----------------------------------------------------------------------------
   • داده دیگر در دیتابیس مرورگر نگه‌داری نمی‌شود؛ فقط در حافظهٔ همان نشست
     نگه داشته می‌شود و منبع اصلی Supabase است.
   • اتصال هر برنامه با «کلید لایسنس» برقرار می‌شود؛ پاسخ سرور شامل
     مرکز، مجوز این برنامه و توکن نشست است.
   • خواندن: کل دادهٔ مرکز یک‌بار گرفته و بعد هر چند ثانیه تغییرات از سرور
     خوانده می‌شود (revision).
   • نوشتن: هر تغییر به یک صف می‌رود و به‌صورت دسته‌ای به سرور فرستاده می‌شود.
   • اگر URL/کلید تنظیم نشده باشد، برنامه در «حالت محلی» و مثل قبل کار می‌کند
     تا آزمون ظاهری ممکن بماند.
   ========================================================================= */
(function () {
  'use strict';

  var APP = window.CLINIC_SUITE_APP || window.CLINIC_PANEL_ROLE || 'admin';
  var LABELS = { admin: 'پنل مدیریت', secretary: 'پنل منشی', attendance: 'ورود و خروج' };

  var cfg = window.DM_CONFIG || {};
  var URL_BASE = String(cfg.SUPABASE_URL || '').replace(/\/+$/, '');
  var ANON = String(cfg.SUPABASE_ANON_KEY || '');
  var MODE = String(cfg.CLOUD_MODE || 'auto').toLowerCase();
  var POLL_MS = Math.max(2000, Number(cfg.POLL_MS || 5000));
  var SESSION_KEY = 'suite_session_' + APP;   // نشست هر برنامه جداست (بدون پیشوند clinic تا مرکز‌محور نشود)
  var DEVICE_KEY = 'suite_device_id';

  var enabled = MODE !== 'local' && !!URL_BASE && !!ANON;
  var configured = !!(URL_BASE && ANON);

  var state = {
    active: false,
    session: null,
    revision: 0,
    snapshot: {},        // entity -> Map(id -> row)
    known: {},           // entity -> Map(id -> json)  (برای تشخیص تغییر)
    queue: [],
    sending: false,
    lastSync: 0,
    lastError: '',
    sessions: [],
    timer: null,
  };

  /* ---------- ابزار ------------------------------------------------------- */
  function deviceId() {
    try {
      var id = localStorage.getItem(DEVICE_KEY);
      if (!id) { id = 'dev-' + Math.random().toString(36).slice(2, 10); localStorage.setItem(DEVICE_KEY, id); }
      return id;
    } catch (e) {
      return 'dev-session';
    }
  }

  function deviceName() {
    var ua = navigator.userAgent || '';
    var os = /android/i.test(ua) ? 'اندروید' : /iphone|ipad|ipod/i.test(ua) ? 'iOS' : /windows/i.test(ua) ? 'ویندوز' : /mac/i.test(ua) ? 'مک' : 'دستگاه';
    var browser = /edg/i.test(ua) ? 'Edge' : /chrome/i.test(ua) ? 'Chrome' : /firefox/i.test(ua) ? 'Firefox' : /safari/i.test(ua) ? 'Safari' : 'مرورگر';
    return os + ' · ' + browser;
  }

  /* کلید جدید (sb_publishable_…) فقط در apikey می‌رود؛ کلید قدیمی JWT در Authorization هم لازم دارد */
  function authHeaders() {
    var h = { 'content-type': 'application/json', apikey: ANON, 'x-client-info': 'clinic-suite/' + APP };
    if (/^eyJ/.test(ANON)) h.authorization = 'Bearer ' + ANON;
    return h;
  }

  async function rpc(fn, body) {
    if (!configured) throw new Error('تنظیمات سرور ناقص است');
    var res;
    try {
      res = await fetch(URL_BASE + '/rest/v1/rpc/' + fn, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify(body || {}),
      });
    } catch (e) {
      throw new Error('ارتباط با سرور برقرار نشد');
    }
    var text = await res.text();
    var data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) { data = { error: text }; }
    if (!res.ok) {
      var msg = (data && (data.message || data.error || data.hint)) || ('خطای سرور (' + res.status + ')');
      throw new Error(msg);
    }
    return data;
  }

  /* ---------- نشست -------------------------------------------------------- */
  function readSession() {
    try {
      var raw = localStorage.getItem(SESSION_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function writeSession(value) {
    try {
      if (value) localStorage.setItem(SESSION_KEY, JSON.stringify(value));
      else localStorage.removeItem(SESSION_KEY);
    } catch (e) {}
  }

  function sessionValid() {
    var s = readSession();
    if (!s || !s.token) return false;
    if (s.expiresAt && Date.parse(s.expiresAt) < Date.now()) return false;
    return true;
  }

  /* ---------- همگام‌سازی داده -------------------------------------------- */
  function entityValue(entity) {
    var rows = state.snapshot[entity];
    if (!rows) return entity === 'cfg' ? {} : [];
    if (entity === 'cfg') {
      var row = rows.get('cfg');
      return row ? row.data : {};
    }
    var list = [];
    rows.forEach(function (row) { if (!row.deleted) list.push(row.data); });
    return list;
  }

  function hydrate(entity) {
    if (typeof Store === 'undefined' || typeof Store.hydrate !== 'function') return;
    Store.hydrate(entity, entityValue(entity));
  }

  function setSnapshotRecord(record) {
    var entity = String(record.entity);
    if (!state.snapshot[entity]) state.snapshot[entity] = new Map();
    if (!state.known[entity]) state.known[entity] = new Map();
    var id = String(record.id);
    if (record.deleted) {
      state.snapshot[entity].delete(id);
      state.known[entity].delete(id);
      return;
    }
    var json = JSON.stringify(record.data);
    state.snapshot[entity].set(id, { id: id, data: record.data });
    state.known[entity].set(id, json);
  }

  function applyRemote(records) {
    if (!records || !records.length) return false;
    var entities = {};
    records.forEach(function (record) {
      setSnapshotRecord(record);
      entities[record.entity] = true;
    });
    Object.keys(entities).forEach(hydrate);
    repaint();
    return true;
  }

  function repaint(entity) {
    if (entity) hydrate(entity);
    if (document.querySelector('.ov')) return;
    if (typeof App !== 'undefined' && typeof App.refresh === 'function') {
      try { App.refresh(); } catch (e) {}
    }
    if (window.ClinicConnection && ClinicConnection.paint) { try { ClinicConnection.paint(); } catch (e) {} }
  }

  function collectWrites(entity, value) {
    var rows = state.snapshot[entity] || (state.snapshot[entity] = new Map());
    var known = state.known[entity] || (state.known[entity] = new Map());
    var writes = [];
    if (entity === 'cfg') {
      var data = value && typeof value === 'object' ? value : {};
      var json = JSON.stringify(data);
      if (known.get('cfg') !== json) {
        rows.set('cfg', { id: 'cfg', data: data });
        known.set('cfg', json);
        writes.push({ entity: entity, id: 'cfg', data: data });
      }
      return writes;
    }
    var list = Array.isArray(value) ? value : [];
    var seen = {};
    list.forEach(function (item) {
      if (!item || item.id == null) return;
      var id = String(item.id);
      seen[id] = true;
      var json = JSON.stringify(item);
      if (known.get(id) !== json) {
        rows.set(id, { id: id, data: item });
        known.set(id, json);
        writes.push({ entity: entity, id: id, data: item });
      }
    });
    Array.from(rows.keys()).forEach(function (id) {
      if (!seen[id]) {
        rows.delete(id);
        known.delete(id);
        writes.push({ entity: entity, id: id, deleted: true });
      }
    });
    return writes;
  }

  function onSave(entity, value) {
    if (!state.active) return;
    var writes = collectWrites(String(entity), value);
    if (!writes.length) return;
    state.queue = state.queue.concat(writes);
    send();
  }

  var sendTimer = null;

  /* لایسنس لغو/منقضی شد یا دستگاه از سرور خارج شد: برنامه قفل و صفحهٔ اتصال نمایش داده می‌شود */
  function isAuthError(text) {
    var s = String(text || '');
    if (/ارتباط|شبکه|network|Failed to fetch|TypeError|timeout|زمان‌قطع|قطع/i.test(s)) return false;
    return /نشست معتبر نیست|لایسنس این نشست|مرکز این نشست|لایسنس غیرفعال|مهلت این لایسنس|منقضی شده/.test(s);
  }
  function lockOut(message) {
    clearInterval(state.timer);
    clearTimeout(sendTimer);
    state.active = false;
    state.session = null;
    state.queue = [];
    writeSession(null);
    showGate(message);
  }
  function send() {
    if (!state.active || state.sending || !state.queue.length) return;
    clearTimeout(sendTimer);
    sendTimer = setTimeout(flush, 320);
  }

  async function flush() {
    if (!state.active || state.sending || !state.queue.length) return;
    state.sending = true;
    var batch = state.queue.splice(0, 300);
    try {
      var result = await rpc('clinic_api', {
        p_token: state.session.token,
        p_action: 'push',
        p_payload: { writes: batch },
      });
      if (result && result.error) throw new Error(result.error);
      if (result && result.rev) state.revision = Number(result.rev);
      state.lastSync = Date.now();
      state.lastError = '';
      if (result && result.sessions) state.sessions = result.sessions;
    } catch (error) {
      state.lastError = String(error.message || error);
      if (isAuthError(state.lastError)) { state.sending = false; lockOut(state.lastError); return; }
      state.queue = batch.concat(state.queue);
      if (window.ClinicConnection && ClinicConnection.paint) { try { ClinicConnection.paint(); } catch (e) {} }
      setTimeout(send, 4000);
      state.sending = false;
      return;
    }
    state.sending = false;
    if (state.queue.length) send();
    if (window.ClinicConnection && ClinicConnection.paint) { try { ClinicConnection.paint(); } catch (e) {} }
  }

  async function poll() {
    if (!state.active) return;
    try {
      var result = await rpc('clinic_api', {
        p_token: state.session.token,
        p_action: 'pull',
        p_payload: { since: state.revision },
      });
      if (result && result.error) throw new Error(result.error);
      if (result && result.rev) state.revision = Number(result.rev);
      if (result && result.sessions) state.sessions = result.sessions;
      state.lastSync = Date.now();
      state.lastError = '';
      applyRemote(result && result.records);
      if (window.ClinicConnection && ClinicConnection.paint) { try { ClinicConnection.paint(); } catch (e) {} }
    } catch (error) {
      state.lastError = String(error.message || error);
      if (isAuthError(state.lastError)) lockOut(state.lastError);
    }
  }

  /* ---------- ورود با لایسنس -------------------------------------------- */
  async function login(license) {
    var result = await rpc('clinic_login', {
      p_license: String(license || '').trim(),
      p_panel: APP,
      p_device: deviceId() + '|' + deviceName(),
    });
    if (!result || result.ok !== true) throw new Error((result && result.error) || 'ورود ناموفق بود');
    var session = {
      token: result.token,
      center: result.center,
      centers: result.centers || (result.center ? [result.center] : []),
      multiCenter: !!result.multi_center,
      license: result.license,
      panel: APP,
      savedAt: new Date().toISOString(),
      expiresAt: result.expires_at || null,
    };
    writeSession(session);
    state.session = session;
    await start(true);
    return session;
  }

  function logout() {
    var s = readSession();
    if (s && s.token) {
      rpc('clinic_api', { p_token: s.token, p_action: 'logout', p_payload: {} }).catch(function () {});
    }
    writeSession(null);
    state.active = false;
    state.session = null;
    state.snapshot = {};
    state.known = {};
    state.queue = [];
    clearInterval(state.timer);
    if (typeof Store !== 'undefined' && Store.clearMem) Store.clearMem();
    location.reload();
  }

  /* ---------- راه‌اندازی -------------------------------------------------- */
  var META_KEYS = ['clinic_centers', 'clinic_licenses', 'clinic_adminCenter', 'clinic_testCenter',
                   'clinic_licenseSession', 'clinicAppearanceMode'];

  /* در حالت ابری هیچ دادهٔ پنلی در مرورگر نگه داشته نمی‌شود؛ بازماندهٔ حالت محلی پاک می‌شود */
  function purgeBrowserData() {
    try {
      var keys = [];
      for (var i = 0; i < localStorage.length; i += 1) keys.push(localStorage.key(i));
      keys.forEach(function (key) {
        if (!key || key.indexOf('clinic') !== 0) return;
        if (META_KEYS.indexOf(key) >= 0) return;
        if (key.indexOf('clinic_cache_') === 0) return; // keep offline cache
        localStorage.removeItem(key);
      });
    } catch (e) {}
  }

  function centerApplied(session) {
    try {
      var list = Array.isArray(session.centers) && session.centers.length
        ? session.centers
        : [session.center || {}];
      var centers = list.map(function (c) {
        return { id: c.id || 'center_main', name: c.name || 'مرکز', active: c.active !== false };
      });
      if (!centers.length) centers = [{ id: 'center_main', name: 'مرکز', active: true }];
      localStorage.setItem('clinic_centers', JSON.stringify(centers));
      var currentId = (session.center && session.center.id) || centers[0].id;
      localStorage.setItem('clinic_adminCenter', currentId);
      localStorage.setItem('clinic_testCenter', currentId);
    } catch (e) {}
  }

  async function switchCenter(centerId) {
    if (!state.session || !state.session.token) throw new Error('نشست معتبر نیست');
    var result = await rpc('clinic_api', {
      p_token: state.session.token,
      p_action: 'switch_center',
      p_payload: { center_id: centerId },
    });
    if (!result || result.ok !== true) throw new Error((result && result.error) || 'تغییر مرکز ناموفق بود');
    state.session.center = result.center;
    state.session.centers = result.centers || state.session.centers;
    state.session.multiCenter = true;
    writeSession(state.session);
    centerApplied(state.session);
    // full re-pull for the new center
    state.active = false;
    clearInterval(state.timer);
    state.snapshot = {};
    state.known = {};
    state.queue = [];
    await start(true);
    return state.session;
  }

  async function start(fromLogin) {
    var session = state.session || readSession();
    if (!session || !session.token) return false;
    state.session = session;
    centerApplied(session);
    var result = await rpc('clinic_api', {
      p_token: session.token,
      p_action: 'pull',
      p_payload: { since: null },
    });
    if (!result || result.ok === false || result.error) throw new Error((result && result.error) || 'دریافت داده از سرور ناموفق بود');
    state.snapshot = {};
    state.known = {};
    state.revision = Number(result.rev || 0);
    state.sessions = result.sessions || [];
    (result.records || []).forEach(setSnapshotRecord);
    state.active = true;
    purgeBrowserData();
    if (typeof Store !== 'undefined' && Store.clearMem) Store.clearMem();
    Object.keys(state.snapshot).forEach(hydrate);
    if (result.license) state.session.license = result.license;
    if (result.center) state.session.center = result.center;
    if (result.centers) state.session.centers = result.centers;
    if (typeof result.multi_center === 'boolean') state.session.multiCenter = result.multi_center;
    centerApplied(state.session);
    writeSession(state.session);
    state.lastSync = Date.now();
    state.lastError = '';
    clearInterval(state.timer);
    state.timer = setInterval(poll, POLL_MS);
    if (window.ClinicConnection && ClinicConnection.paint) { try { ClinicConnection.paint(); } catch (e) {} }
    try {
      if (typeof CenterHub !== 'undefined' && CenterHub.mountContext) CenterHub.mountContext();
    } catch (e) {}
    if (typeof App !== 'undefined' && App.refresh) {
      try { App.refresh(); } catch (e) {}
    } else {
      try { repaint(); } catch (e) {}
    }
    // اگر UI هنوز خالی بود، یک رفرش سبک بعد از تیک
    setTimeout(function () {
      try {
        if (typeof CenterHub !== 'undefined' && CenterHub.mountContext) CenterHub.mountContext();
        if (typeof App !== 'undefined' && App.refresh) App.refresh();
        if (window.ClinicConnection && ClinicConnection.paint) ClinicConnection.paint();
        // اگر main خالی ماند، یک‌بار کل شل را دوباره بساز
        var view = document.getElementById('view');
        if (view && !view.innerHTML.trim() && typeof App !== 'undefined' && App.boot) {
          try {
            var tabs = (window.TABS || []);
            if (!tabs.length && typeof orderTabs === 'function' && typeof TABS !== 'undefined') tabs = orderTabs(TABS);
          } catch (e2) {}
        }
        if (view && !String(view.innerHTML||'').trim()) {
          view.innerHTML = '<div class="card"><b>در حال بارگذاری خانه…</b><div class="mut">اگر چند ثانیه طول کشید، صفحه را یک‌بار رفرش کنید.</div></div>';
          if (typeof App !== 'undefined' && App.refresh) setTimeout(function(){ try{App.refresh()}catch(e){} }, 100);
        }
      } catch (e) { console.error(e); }
    }, 50);
    return true;
  }

  /* ---------- دروازهٔ اتصال (بدون لایسنس، برنامه باز نمی‌شود) ------------- */
  function gateStyles() {
    if (document.getElementById('clinicCloudStyles')) return;
    var style = document.createElement('style');
    style.id = 'clinicCloudStyles';
    style.textContent = [
      '.cloud-gate{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:18px;',
      'background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--pri) 18%,var(--bg)) 0,var(--bg) 70%);overflow:auto}',
      '.cloud-gate-card{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;',
      'padding:22px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 24px 60px -30px rgba(0,0,0,.5)}',
      '.cloud-gate-logo{width:64px;height:64px;border-radius:18px;display:block;margin:0 auto 14px}',
      '.cloud-gate h2{margin:0 0 4px;font-size:17px;text-align:center}',
      '.cloud-gate p.lead{margin:0 0 16px;font-size:12.5px;line-height:1.9;color:var(--mut);text-align:center}',
      '.cloud-gate label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}',
      '.cloud-gate input{width:100%;padding:12px 13px;border:1px solid var(--line-2);border-radius:12px;',
      'background:var(--bg);color:var(--ink);font:inherit;margin-bottom:12px}',
      '.cloud-gate input:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}',
      '.cloud-gate .gate-error{display:none;margin-bottom:10px;padding:9px 11px;border-radius:10px;font-size:12px;',
      'background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--ink)}',
      '.cloud-gate .gate-error.is-on{display:block}',

      '.cloud-gate .gate-server{margin-top:10px;font-size:11px;color:var(--mut);text-align:center;direction:ltr}',
    ].join('');

  function showGate(message) {

      var err = existing.querySelector('.gate-error');

    }

    wrap.className = 'cloud-gate';

      '<img class="cloud-gate-logo" src="icons/icon-192.png" alt="">' +
      '<h2>' + (LABELS[APP] || 'برنامه') + '</h2>' +
      '<p class="lead">برای اتصال به دادهٔ مرکز، کلید لایسنس را وارد کنید.</p>' +
      '<div class="gate-error' + (message ? ' is-on' : '') + '" id="cloudGateError">' + (message || '') + '</div>' +
      '<label for="cloudLicense">کلید لایسنس</label>' +
      '<input id="cloudLicense" autocomplete="off" spellcheck="false" dir="ltr" placeholder="CLINIC-XXXX-XXXX">' +
      '<button class="btn big" id="cloudConnect" type="submit">اتصال</button>' +
      '<p class="gate-note">با لایسنس مدیریت می‌توانید چند مرکز را نظارت کنید. کلید را از مدیر سامانه بگیرید.</p>' +
      '</form>';
    document.body.appendChild(wrap);
    var form = wrap.querySelector('#cloudGateForm');
    form.addEventListener('submit', function (event) {
      event.preventDefault();
      var button = wrap.querySelector('#cloudConnect');
      var error = wrap.querySelector('#cloudGateError');
      button.disabled = true;
      button.textContent = 'در حال اتصال…';
      error.classList.remove('is-on');
      login(wrap.querySelector('#cloudLicense').value)
        .then(function () {
          wrap.remove();
          try { if (window.ClinicCloud && ClinicCloud.centerName) {} } catch (e) {}
          // رفرش کامل تا هدر، مراکز و داشبورد با دادهٔ سرور رسم شوند
          location.reload();
        })
        .catch(function (problem) {
          error.textContent = String(problem.message || problem);
          error.classList.add('is-on');
        })
        .finally(function () {
          button.disabled = false;
          button.textContent = 'اتصال';
        });
    });
    var first = wrap.querySelector('#cloudLicense');
    if (first) setTimeout(function () { first.focus({ preventScroll: true }); }, 120);
  }

  function boot() {
    if (!enabled) return;              // حالت محلی: چیزی تغییر نمی‌کند
    if (!sessionValid()) { showGate(''); return; }
    start(false).catch(function (problem) {
      var text = String(problem.message || problem);
      if (/نشست|توکن|token|منقضی|لایسنس/i.test(text)) {

  window.ClinicCloud = {

    deleteCenter: async function (centerId) {

      var result = await rpc('clinic_api', {
        p_token: session.token,
        p_action: 'delete_center',
        p_payload: { center_id: centerId },
      });
      if (!result || result.ok !== true) throw new Error((result && result.error) || 'حذف مرکز ناموفق بود');
      return result;
    },
    issueStaffLicense: async function () {
      throw new Error('صدور لایسنس از پنل مدیریت غیرفعال است؛ لایسنس فقط توسط مدیر سیستم تعریف می‌شود');
    },
    onSave: onSave,
    repaint: function () { repaint(); },
    pull: poll,
    status: function () {
      return {
        enabled: enabled,
        active: state.active,
        center: (state.session && state.session.center) || null,
        license: (state.session && state.session.license) || null,
        panel: APP,
        revision: state.revision,
        pending: state.queue.length,
        lastSync: state.lastSync,
        error: state.lastError,
        sessions: state.sessions || [],
        server: URL_BASE.replace(/^https?:\/\//, ''),
      };
    },
    openGate: function () { showGate(''); },
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, { once: true });
  } else {
    boot();
  }
})();
</script>

/* کتابخانهٔ مشترک سه پنل: داده، تقویم شمسی، شیت، تب‌ها و ماژول‌ها */

const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
function numToWordsFa(n){
  n = Math.floor(Math.abs(Number(n)||0));
  if(n===0) return 'صفر';
  const yekan=['','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه'];
  const dahgan=['','','بیست','سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود'];
  const dahyek=['ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده'];
  const sadgan=['','صد','دویست','سیصد','چهارصد','پانصد','ششصد','هفتصد','هشتصد','نهصد'];
  const scale=['','هزار','میلیون','میلیارد','بیلیون','تریلیون'];
  const three = x => {
    const s=[];
    const h=Math.floor(x/100), r=x%100;
    if(h) s.push(sadgan[h]);
    if(r>=10 && r<20) s.push(dahyek[r-10]);
    else {
      const d=Math.floor(r/10), y=r%10;
      if(d) s.push(dahgan[d]);
      if(y) s.push(yekan[y]);
    }
    return s.join(' و ');
  };
  const parts=[];
  let i=0;
  while(n>0){
    const chunk = n % 1000;
    if(chunk){
      const w = three(chunk);
      parts.unshift(w + (scale[i] ? ' ' + scale[i] : ''));
    }
    n = Math.floor(n/1000);
    i++;
  }
  return parts.join(' و ');
}

function money(n){
  const v = Number(n||0);
  const abs = Math.floor(Math.abs(v));
  const grouped = fa(abs.toLocaleString('en-US'));
  const sign = v<0 ? '−' : '';
  return `${sign}${grouped} تومان`;
}

}

// ورودی مبلغ با پیش‌نمایش حروف
function toAsciiDigits(value){

    .replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)));
}

  return Number(toAsciiDigits(value).replace(/[^\d-]/g,''))||0;
}

      if(!raw){ if(prev) prev.textContent=''; return; }

function bindTimeFields(scope){
  $$('[data-time]',scope).forEach(inp=>{

      let v = toAsciiDigits(inp.value).replace(/[^\d:]/g,'');
      if(v.length >= 3 && !v.includes(':')) v = v.slice(0,2)+':'+v.slice(2);

}
const pad=n=>String(n).padStart(2,'0');
function g2j(gy,gm,gd){const t=[0,31,59,90,120,151,181,212,243,273,304,334];const y2=gm>2?gy+1:gy;
 let d=355666+365*gy+Math.floor((y2+3)/4)-Math.floor((y2+99)/100)+Math.floor((y2+399)/400)+gd+t[gm-1];
 let jy=-1595+33*Math.floor(d/12053);d%=12053;jy+=4*Math.floor(d/1461);d%=1461;
 if(d>365){jy+=Math.floor((d-1)/365);d=(d-1)%365}
 return [jy,d<186?1+Math.floor(d/31):7+Math.floor((d-186)/30),1+(d<186?d%31:(d-186)%30)]}
const TZ = 'Asia/Tehran';

function tehranParts(){
  const fmt = new Intl.DateTimeFormat('en-GB',{
    timeZone: TZ, year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'
  });
  const parts = fmt.formatToParts(new Date());
  const get = t => parts.find(p=>p.type===t)?.value || '0';
  return {
    gy:+get('year'), gm:+get('month'), gd:+get('day'),
    hh:+get('hour'), mm:+get('minute'), ss:+get('second')
  };
}

function T(){
  const t = tehranParts();
  const [y,m,d] = g2j(t.gy, t.gm, t.gd);
  return {
    key: `${y}/${pad(m)}/${pad(d)}`,
    month: `${y}/${pad(m)}`,
    time: `${pad(t.hh)}:${pad(t.mm)}`,
    hh: t.hh, mm: t.mm,
    now: new Date()
  };
}

const Store=(()=>{const mem={};const seed={

 const migrate=t=>{
  if(CenterHub.current()!=='center_main')return undefined;

 };

};})();

function nextClientFileNo(){
  const nums=new Set(Store.all('people').filter(p=>p.type==='client').map(p=>+p.fileNo).filter(n=>Number.isInteger(n)&&n>0));

function ensureClientFileNumbers(){
  const clients=Store.all('people').filter(p=>p.type==='client');
  const used=new Set();
  for(const p of clients){

    if(Number.isInteger(n)&&n>0)used.add(n);

const en=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const jp=k=>en(k).split('/').map(Number);
const jk=(y,m,d)=>`${y}/${pad(m)}/${pad(d)}`;
const leap=y=>[1,5,9,13,17,22,26,30].includes(y%33);
const dim=(y,m)=>m<7?31:m<12?30:(leap(y)?30:29);
const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function addM(k,n){let[y,m,d]=jp(k);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return jk(y,m,Math.min(d,dim(y,m)))}
function j2g(jy,jm,jd){jy+=1595;let days=-355668+365*jy+Math.floor(jy/33)*8+Math.floor((jy%33+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);
 let gy=400*Math.floor(days/146097);days%=146097;if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++}
 gy+=4*Math.floor(days/1461);days%=1461;if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}
 let gd=days+1;const sal=[0,31,(gy%4===0&&gy%100!==0)||gy%400===0?29:28,31,30,31,30,31,31,30,31,30,31];let gm;
 for(gm=0;gm<13&&gd>sal[gm];gm++)gd-=sal[gm];return[gy,gm,gd]}
const wd=(y,m,d)=>{const[g,mm,dd]=j2g(y,m,d);return(new Date(g,mm-1,dd).getDay()+1)%7}; // 0=شنبه … 6=جمعه
// مناسبت‌های شمسی (ثابت)
const HOL_SOLAR = {
  '1/1':'نوروز','1/2':'نوروز','1/3':'نوروز','1/4':'نوروز',
  '1/12':'روز جمهوری اسلامی','1/13':'سیزده‌به‌در',
  '3/14':'رحلت امام خمینی','3/15':'قیام ۱۵ خرداد',
  '11/22':'پیروزی انقلاب','12/29':'ملی شدن صنعت نفت'
};

// مناسبت‌های قمری — جدول با تاریخ‌های ماه قمری/روز باید در صورت نیاز تکمیل شود.
const HOL_LUNAR = {};

function lunarToSolar(hy,hm,hd){
  const jd = Math.floor((11*hy+3)/30) + 354*hy + 30*hm
    - Math.floor((hm-1)/2) + hd + 1948440 - 385;
  let l = jd + 68569;
  const n = Math.floor(4*l/146097); l -= Math.floor((146097*n+3)/4);
  const i = Math.floor(4000*(l+1)/1461001); l -= Math.floor(1461*i/4) - 31;
  const j = Math.floor(80*l/2447);
  const day = l - Math.floor(2447*j/80);
  l = Math.floor(j/11);
  const month = j + 2 - 12*l;
  const year = 100*(n-49) + i + l;
  return [year,month,day];
}

function buildLunarHolidays(jy){
  const gy = jy + 621;
  const hy = Math.floor((gy - 622) * 33/32) + 1;
  const out = {};
  for(const [k,v] of Object.entries(HOL_LUNAR)){
    const [hm,hd] = k.split('/').map(Number);
    const [y,m,d] = lunarToSolar(hy,hm,hd);
    const [jj,jm,jd] = g2j(y,m,d);
    if(jj===jy) out[`${jm}/${jd}`] = v;
  }
  return out;
}

const HOL = { ...HOL_SOLAR };

function dayInfo(k){
  const [y,m,d] = jp(k);
  const lunar = buildLunarHolidays(y);
  const h = lunar[`${m}/${d}`] || HOL[`${m}/${d}`];
  const f = wd(y,m,d)===6;
  return { hol: !!h || f, name: h || (f?'جمعه':'') };
}
const dayKey=o=>{const t=tehranParts(),n=new Date(Date.UTC(t.gy,t.gm-1,t.gd)-o*864e5),[y,m,d]=g2j(n.getUTCFullYear(),n.getUTCMonth()+1,n.getUTCDate());return jk(y,m,d)};
const hm=s=>{const[a,b]=String(s||'0:0').split(':').map(Number);return a*60+(b||0)};
const hrs=min=>fa((min/60).toFixed(1));
const durationLabel=min=>{const n=Math.max(0,Math.round(Number(min)||0));let h=(n/60).toFixed(2);while(h.includes('.')&&h.endsWith('0'))h=h.slice(0,-1);if(h.endsWith('.'))h=h.slice(0,-1);return `${fa(n)} دقیقه · ${fa(h.replace('.', '٫'))} ساعت`};
const opt=(arr,v)=>arr.map(([k,l])=>`<option value="${k}"${k==v?' selected':''}>${esc(l)}</option>`).join('');
function orderTabs(tabs){const o=Store.cfg('order',[]);return tabs.slice().sort((a,b)=>(o.indexOf(a.id)+1||99)-(o.indexOf(b.id)+1||99))}

/* ---- وضعیت پرونده (دسته‌بندی مراجعین) ---- */
const CASE_STATUS_COLORS=['#2f7df6','#1f7a45','#c99412','#b83a32','#7564bf','#0b6e78','#d38b26','#31bcc8','#e77470','#59b3a8'];
const CASE_STATUS_DEFAULT={id:'__running',name:'در حال اجرا',color:'#1f7a45'};
function caseStatusCats(){
  const a=Store.cfg('caseStatusCats',[]);
  return (Array.isArray(a)?a:[]).slice().sort((x,y)=>(Number(x.order)||0)-(Number(y.order)||0));
}
function saveCaseStatusCats(list){
  Store.setCfg('caseStatusCats',list.map((c,i)=>({id:c.id,name:c.name,color:c.color||CASE_STATUS_COLORS[i%CASE_STATUS_COLORS.length],order:i})));
}
function ensureDefaultCaseStatusCat(){
  const cats=caseStatusCats();
  if(cats.some(c=>c.name==='در حال اجرا'||String(c.id)==='cs_running'))return;
  // فقط اگر هیچ دسته‌ای نیست، پیش‌فرض را بساز
  if(!cats.length){
    saveCaseStatusCats([{id:'cs_running',name:'در حال اجرا',color:CASE_STATUS_DEFAULT.color,order:0}]);
  }
}
function caseStatusById(id){
  if(id==null||id==='')return null;
  return caseStatusCats().find(c=>String(c.id)===String(id))||null;
}
function caseStatusOfPerson(p){
  if(p&&p.caseStatusId){
    const c=caseStatusById(p.caseStatusId);
    if(c)return c;
  }
  // بدون دسته = در حال اجرا
  const running=caseStatusCats().find(c=>c.name==='در حال اجرا'||String(c.id)==='cs_running');
  return running||CASE_STATUS_DEFAULT;
}
function caseStatusChipHtml(p){
  const c=caseStatusOfPerson(p);
  if(!c)return '';
  return ` <span class="fin-pill" style="background:color-mix(in srgb,${c.color} 20%,var(--card));color:${c.color};border:1px solid color-mix(in srgb,${c.color} 40%,var(--line));font-weight:700">${esc(c.name)}</span>`;
}
function caseStatusCardStyle(p){
  const c=caseStatusOfPerson(p);
  if(!c||!c.color)return '';
  return `border-inline-start:4px solid ${c.color};`;
}
function caseStatusCount(id){
  return Store.all('people').filter(p=>p.type==='client'&&String(p.caseStatusId||'')===String(id)).length;
}
function caseStatusSetMembers(catId,ids){
  const want=new Set((ids||[]).map(String));
  Store.all('people').filter(p=>p.type==='client').forEach(p=>{
    const cur=String(p.caseStatusId||'');
    const id=String(p.id);
    if(want.has(id)&&cur!==String(catId))Store.upd('people',p.id,{caseStatusId:catId});
    else if(!want.has(id)&&cur===String(catId))Store.upd('people',p.id,{caseStatusId:''});
  });
}
function caseStatusMovePerson(pid,toCatId){
  Store.upd('people',pid,{caseStatusId:toCatId||''});
}
function caseStatusHub(rootEl,opts={}){
  const back=typeof opts.back==='function'?opts.back:()=>{};
  let view='list'; // list | cat
  let activeCatId=null;
  let q='';
  let pickMode=false;
  let selected=new Set();

  const paint=()=>{
    if(view==='cat'&&activeCatId)return paintCat();
    const cats=caseStatusCats();
    rootEl.innerHTML=`
      <button class="btn sec" id="csBack" type="button">← بازگشت به مراجعین</button>
      <div class="card" style="margin-top:10px">
        <b>وضعیت پرونده</b>
        <div class="mut">دسته‌بندی‌ها را بسازید، رنگ بدهید و مراجعین را بین آن‌ها جابه‌جا کنید. مراجع بدون دسته به‌صورت خودکار «در حال اجرا» نمایش داده می‌شوند.</div>
        <button class="btn big" id="csAdd" type="button" style="margin-top:10px">+ دسته‌بندی جدید</button>
      </div>
      <div class="lst" id="csList"></div>`;
    $('#csBack',rootEl).onclick=()=>back();
    $('#csAdd',rootEl).onclick=()=>addCat();
    const host=$('#csList',rootEl);
    if(!cats.length){
      host.innerHTML='<div class="empty">هنوز دسته‌بندی‌ای تعریف نشده. مثلاً «در حال اجرا» یا «بایگانی یک».</div>';
      return;
    }
    host.innerHTML=cats.map((c,idx)=>`
      <div class="card" data-cat="${esc(c.id)}" style="border-inline-start:5px solid ${esc(c.color)};cursor:pointer">
        <div class="row">
          <div class="g">
            <b style="display:flex;align-items:center;gap:8px">
              <i style="width:12px;height:12px;border-radius:50%;background:${esc(c.color)};display:inline-block"></i>
              ${esc(c.name)}
            </b>
            <div class="mut">${fa(caseStatusCount(c.id))} مراجع · برای مدیریت اعضا لمس کنید</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:4px">
            <button class="btn sec sm" data-up="${esc(c.id)}" type="button" ${idx===0?'disabled':''}>↑</button>
            <button class="btn sec sm" data-dn="${esc(c.id)}" type="button" ${idx===cats.length-1?'disabled':''}>↓</button>
          </div>
        </div>
        <div class="center-card-actions">
          <button class="btn sec sm" data-edit="${esc(c.id)}" type="button">ویرایش</button>
          <button class="btn bad sm" data-del="${esc(c.id)}" type="button">حذف دسته</button>
        </div>
      </div>`).join('');
    $$('[data-cat]',host).forEach(card=>{
      card.onclick=e=>{
        if(e.target.closest('button'))return;
        activeCatId=card.dataset.cat;view='cat';q='';pickMode=false;selected=new Set();paint();
      };
    });
    $$('[data-up]',host).forEach(b=>b.onclick=e=>{e.stopPropagation();reorder(b.dataset.up,-1)});
    $$('[data-dn]',host).forEach(b=>b.onclick=e=>{e.stopPropagation();reorder(b.dataset.dn,1)});
    $$('[data-edit]',host).forEach(b=>b.onclick=e=>{e.stopPropagation();editCat(b.dataset.edit)});
    $$('[data-del]',host).forEach(b=>b.onclick=e=>{e.stopPropagation();delCat(b.dataset.del)});
  };

  const reorder=(id,dir)=>{
    const cats=caseStatusCats();
    const i=cats.findIndex(c=>String(c.id)===String(id));
    const j=i+dir;
    if(i<0||j<0||j>=cats.length)return;
    const t=cats[i];cats[i]=cats[j];cats[j]=t;
    saveCaseStatusCats(cats);paint();
  };

  const colorPickerHtml=(selected)=>{
    return `<div class="cs-colors" style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 12px">`+
      CASE_STATUS_COLORS.map(c=>`<button type="button" data-color="${c}" class="cs-color-btn${c===selected?' on':''}" style="aspect-ratio:1;border-radius:12px;border:2px solid ${c===selected?'var(--ink)':'var(--line)'};background:${c};padding:0;cursor:pointer;box-shadow:${c===selected?'0 0 0 3px color-mix(in srgb,'+c+' 35%,transparent)':'none'}" aria-label="${c}"></button>`).join('')+
      `</div>`;
  };
  const bindColorPicker=(b,initial)=>{
    let color=initial||CASE_STATUS_COLORS[0];
    const sync=()=>{
      $$('.cs-color-btn',b).forEach(btn=>{
        const on=btn.dataset.color===color;
        btn.classList.toggle('on',on);
        btn.style.borderColor=on?'var(--ink)':'var(--line)';
        btn.style.boxShadow=on?('0 0 0 3px color-mix(in srgb,'+btn.dataset.color+' 35%,transparent)'):'none';
      });
    };
    $$('.cs-color-btn',b).forEach(btn=>btn.onclick=()=>{color=btn.dataset.color;sync()});
    sync();
    return ()=>color;
  };
  const addCat=()=>{
    const used=caseStatusCats().length;
    const initial=CASE_STATUS_COLORS[used%CASE_STATUS_COLORS.length];
    const html=`<label>نام دسته‌بندی (مثلاً بایگانی یک)</label><input data-k="name" type="text" placeholder="مثلاً بایگانی یک">
      <label>رنگ</label>${colorPickerHtml(initial)}
      <button class="btn big" id="ok" type="button">ذخیره</button>`;
    sheet('دسته‌بندی جدید',html,(b,c)=>{
      const getColor=bindColorPicker(b,initial);
      $('#ok',b).onclick=()=>{
        const name=String(($('[data-k="name"]',b)?.value||'')).trim();
        if(!name)return toast('نام را وارد کنید');
        const cats=caseStatusCats();
        if(cats.some(x=>x.name===name))return toast('این نام قبلاً ثبت شده');
        cats.push({id:'cs'+Date.now().toString(36),name,color:getColor(),order:cats.length});
        saveCaseStatusCats(cats);toast('دسته‌بندی اضافه شد');c();paint();
      };
    });
  };

  const editCat=id=>{
    const cat=caseStatusById(id);if(!cat)return;
    const html=`<label>نام</label><input data-k="name" type="text" value="${esc(cat.name)}">
      <label>رنگ</label>${colorPickerHtml(cat.color||CASE_STATUS_COLORS[0])}
      <button class="btn big" id="ok" type="button">ذخیره</button>`;
    sheet('ویرایش دسته‌بندی',html,(b,c)=>{
      const getColor=bindColorPicker(b,cat.color||CASE_STATUS_COLORS[0]);
      $('#ok',b).onclick=()=>{
        const name=String(($('[data-k="name"]',b)?.value||'')).trim();
        if(!name)return toast('نام را وارد کنید');
        const cats=caseStatusCats().map(c=>String(c.id)===String(id)?{...c,name,color:getColor()}:c);
        saveCaseStatusCats(cats);toast('ذخیره شد');c();paint();
      };
    });
  };

  const delCat=id=>{
    const cat=caseStatusById(id);if(!cat)return;
    const n=caseStatusCount(id);
    const go=()=>{
      Store.all('people').filter(p=>String(p.caseStatusId||'')===String(id)).forEach(p=>Store.upd('people',p.id,{caseStatusId:''}));
      saveCaseStatusCats(caseStatusCats().filter(c=>String(c.id)!==String(id)));
      toast('دسته حذف شد');view='list';activeCatId=null;paint();
    };
    if(typeof confirmSheet==='function'){
      confirmSheet(`دسته «${cat.name}» حذف شود؟${n?` ${fa(n)} مراجع از این وضعیت خارج می‌شوند.`:''}`,go);
    }else if(confirm(`حذف «${cat.name}»؟`))go();
  };

  const paintCat=()=>{
    const cat=caseStatusById(activeCatId);
    if(!cat){view='list';activeCatId=null;return paint()}
    const members=Store.all('people').filter(p=>p.type==='client'&&String(p.caseStatusId||'')===String(cat.id))
      .filter(p=>!q||(p.name+(p.phone||'')+String(p.fileNo||'')).toLowerCase().includes(q.toLowerCase()))
      .sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'fa'));
    const otherCats=caseStatusCats().filter(c=>String(c.id)!==String(cat.id));
    rootEl.innerHTML=`
      <button class="btn sec" id="csBackList" type="button">← همهٔ دسته‌ها</button>
      <div class="card" style="margin-top:10px;border-inline-start:5px solid ${esc(cat.color)}">
        <b style="display:flex;align-items:center;gap:8px"><i style="width:12px;height:12px;border-radius:50%;background:${esc(cat.color)};display:inline-block"></i>${esc(cat.name)}</b>
        <div class="mut">${fa(caseStatusCount(cat.id))} مراجع در این وضعیت</div>
        <div class="bar" style="margin-top:10px">
          <input id="csQ" placeholder="جست‌وجوی مراجع در این دسته…" style="margin:0" value="${esc(q)}">
        </div>
        <div class="center-card-actions">
          <button class="btn" id="csPick" type="button">+ افزودن از فهرست مراجعین</button>
        </div>
      </div>
      <div class="lst" id="csMembers"></div>`;
    $('#csBackList',rootEl).onclick=()=>{view='list';activeCatId=null;q='';pickMode=false;paint()};
    $('#csQ',rootEl).oninput=e=>{q=e.target.value;paintCat()};
    $('#csPick',rootEl).onclick=()=>openPicker(cat);
    const host=$('#csMembers',rootEl);
    if(!members.length){
      host.innerHTML='<div class="empty">مراجعی در این دسته نیست. با «افزودن از فهرست مراجعین» عضو اضافه کنید.</div>';
      return;
    }
    host.innerHTML=members.map(p=>`
      <div class="card row" data-pid="${esc(p.id)}">
        <div class="g">
          <b>${esc(politeName(p))}</b>
          <div class="mut">پروندهٔ ${fa(p.fileNo||'—')} · ${esc(p.phone||'')}</div>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end">
          ${otherCats.length?`<select data-move="${esc(p.id)}" style="margin:0;width:auto;min-width:120px">
            <option value="">انتقال به…</option>
            ${otherCats.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}
            <option value="__none">بدون وضعیت</option>
          </select>`:''}
          <button class="btn bad sm" data-rm="${esc(p.id)}" type="button">حذف از دسته</button>
        </div>
      </div>`).join('');
    $$('[data-rm]',host).forEach(b=>b.onclick=()=>{
      caseStatusMovePerson(b.dataset.rm,'');
      toast('از دسته حذف شد');paintCat();
    });
    $$('[data-move]',host).forEach(sel=>sel.onchange=()=>{
      const v=sel.value;if(!v)return;
      caseStatusMovePerson(sel.dataset.move,v==='__none'?'':v);
      toast('منتقل شد');paintCat();
    });
  };

  const openPicker=cat=>{
    const all=Store.all('people').filter(p=>p.type==='client')
      .sort((a,b)=>(Number(a.fileNo)||1e15)-(Number(b.fileNo)||1e15)||String(a.name||'').localeCompare(String(b.name||''),'fa'));
    let pq='';
    const already=new Set(Store.all('people').filter(p=>String(p.caseStatusId||'')===String(cat.id)).map(p=>String(p.id)));
    selected=new Set(already);
    const html=`
      <div class="mut" style="margin-bottom:8px">مراجعین را تیک بزنید تا در «${esc(cat.name)}» قرار گیرند. تیک‌برداشتن = خروج از این دسته.</div>
      <input id="pickQ" placeholder="جست‌وجوی نام، تلفن یا شماره پرونده…" style="margin-bottom:8px">
      <div id="pickList" style="max-height:50vh;overflow:auto"></div>
      <button class="btn big" id="pickOk" type="button">ثبت انتخاب‌ها</button>`;
    sheet('افزودن مراجع به '+cat.name,html,(b,c)=>{
      const render=()=>{
        const rows=all.filter(p=>!pq||(p.name+(p.phone||'')+String(p.fileNo||'')).toLowerCase().includes(pq.toLowerCase()));
        $('#pickList',b).innerHTML=rows.length?rows.map(p=>{
          const on=selected.has(String(p.id));
          const other=p.caseStatusId&&String(p.caseStatusId)!==String(cat.id)?caseStatusById(p.caseStatusId):null;
          return `<button type="button" class="member-select${on?' selected':''}" data-pid="${esc(p.id)}">
            <span class="member-select-mark">${on?'✓':''}</span>
            <span class="g"><b>${esc(politeName(p))}</b>
              <small class="mut">پروندهٔ ${fa(p.fileNo||'—')} · ${esc(p.phone||'')}${other?' · الان: '+esc(other.name):''}</small>
            </span>
          </button>`;
        }).join(''):'<div class="empty">موردی نیست</div>';
        $$('[data-pid]',b).forEach(btn=>btn.onclick=()=>{
          const id=String(btn.dataset.pid);
          if(selected.has(id))selected.delete(id);else selected.add(id);
          render();
        });
      };
      $('#pickQ',b).oninput=e=>{pq=e.target.value;render()};
      $('#pickOk',b).onclick=()=>{
        caseStatusSetMembers(cat.id,[...selected]);
        toast('اعضای دسته به‌روز شد');
        c();paintCat();
      };
      render();
    });
  };

const SMSBridge={

 /* ارسال یک پیامک (نیتیو در صورت وجود و مجوز، وگرنه باز کردن برنامهٔ پیامک گوشی) */

   else if(smsHas('requestSmsPermission')){SMSX.pendingSingle={phone,text,id:log.id};smsNat().requestSmsPermission();return true}

  }

function smsSweep(){const now=Date.now(),wt=Object.keys(SMSX.waiters).length;
 if(SMSX.running&&SMSX.bulk){if(now-Math.max(SMSX.runStart||0,SMSX.lastEvt||0)>20000+SMSX.bulk.ids.length*2500)smsForceFinish()}
 else if(SMSX.running&&SMSX.runStart&&now-SMSX.runStart>1800000)SMSX.running=false;
 try{Store.all('sms').forEach(m=>{if(m.status!=='pending')return;const age=now-(m.ts||0);if(m.ts?age>(SMSX.running?600000:45000):(!SMSX.running&&!wt))smsSetStatus(m.id,'sent_u')})}catch(e){}}

  toast('مجوز پیامک رد شد');

 }

};
window.onSmsBulkStart=function(d){SMSX.ui&&SMSX.ui.start&&SMSX.ui.start((d&&d.total)||0)};

window.onSmsBulkComplete=function(d){

 if(ph&&SMSX.waiters[ph])wk=ph;else if(d.phone&&SMSX.waiters[d.phone])wk=d.phone;
 else if(ph)wk=Object.keys(SMSX.waiters).find(k=>smsNorm(k).slice(-10)===ph.slice(-10))||null;
 else wk=Object.keys(SMSX.waiters)[0]||null;
 if(wk){w=SMSX.waiters[wk];delete SMSX.waiters[wk]}
 if(w){smsSetStatus(w.id,d.ok?'sent':'failed');w.res&&w.res(!!d.ok)}
 else{const pend=Store.all('sms').filter(x=>x.status==='pending'||x.status==='unknown');const m=ph?pend.find(x=>smsNorm(x.phone).slice(-10)===ph.slice(-10)):pend[pend.length-1];if(m)smsSetStatus(m.id,d.ok?'sent':'failed')}

/* SMS-V10: ثبت رویدادهای APK و پایان‌دادن خودکار به ارسال‌های بی‌گزارش */
SMSX.log=[];SMSX.lastEvt=0;
const smsLogEvt=(n,d)=>{SMSX.lastEvt=Date.now();try{SMSX.log.push(new Date().toTimeString().slice(0,8)+' '+n+' '+JSON.stringify(d===undefined?null:d));if(SMSX.log.length>60)SMSX.log.shift()}catch(e){}};
['onSmsBulkStart','onSmsBulkProgress','onSmsBulkComplete','onSmsResult','onSmsPermission'].forEach(n=>{const f=window[n];if(typeof f==='function')window[n]=function(d){smsLogEvt(n,d);return f.apply(this,arguments)}});

/* ─── ارسال جداگانه برای هر نفر (متن شخصی‌سازی‌شده) به‌صورت صف؛ هر پیام بعد از نتیجهٔ قبلی ─── */
async function smsRunPersonal(list,fillOne,ui){
 SMSX.running=true;SMSX.runStart=Date.now();SMSX.stop=false;let sent=0,failed=0,unk=0;const delay=list.length>50?1500:800;
 ui.start&&ui.start(list.length);
 for(let i=0;i<list.length;i++){
  if(SMSX.stop)break;
  const r=list[i],text=fillOne(r),log=smsLog(r,r.phone,text,'pending');
  const ok=await new Promise(res=>{
   const to=setTimeout(()=>{const w=SMSX.waiters[r.phone];if(w&&w.id===log.id)delete SMSX.waiters[r.phone];res(null)},25000);
   SMSX.waiters[r.phone]={id:log.id,res:v=>{clearTimeout(to);res(v)}};
   try{smsNativeSend(r.phone,text)}catch(e){clearTimeout(to);delete SMSX.waiters[r.phone];smsSetStatus(log.id,'failed');res(false)}
  });
  if(ok===true)sent++;else if(ok===false){failed++;SMSX.stop=true}else{unk++;smsSetStatus(log.id,'sent_u')}
  ui.progress&&ui.progress({current:i+1,total:list.length,failed:failed+unk});
  if(i<list.length-1)await new Promise(r=>setTimeout(r,delay));
 }
 SMSX.running=false;
 ui.done&&ui.done({ok:sent+unk>0,sent,failed,unknown:unk,stopped:SMSX.stop,error:(sent+unk>0?'':'send_failed')});
}

const schedFor=(pid,date)=>{const o=Store.all('ovr').find(x=>String(x.pid)===String(pid)&&x.date===date);if(o)return o.off?null:{from:o.from,to:o.to,ovr:1};const[y,m,d]=jp(date),day=wd(y,m,d),sc=Store.cfg('sch_'+pid,{from:'09:00',to:'17:00',days:[0,1,2,3,4,5]}),days=Array.isArray(sc.days)?sc.days.map(Number):[0,1,2,3,4,5];if(!days.includes(day))return null;return {...sc,days}};
const attSegments=(pid,date)=>Store.all('att').filter(a=>String(a.pid)===String(pid)&&String(a.date)===String(date)).slice().sort((a,b)=>hm(a.in||'00:00')-hm(b.in||'00:00'));
const attOpen=(pid,date)=>attSegments(pid,date).find(a=>!a.out)||null;

const attAuditLabel=a=>(a?.segments||[a]).filter(Boolean).map((x,i)=>`بازهٔ ${fa(i+1)}: ${fa(x.in||'—')}–${fa(x.out||'در حال کار')} · مشمول حقوق ${durationLabel(workMin(x))}${x.approvalStatus==='pending'?` · در انتظار تأیید (${durationLabel(x.requestExtraMinutes||0)})`:x.approvalStatus==='approved'?` · اضافه‌کاری تأییدشده`:x.approvalStatus==='rejected'?` · اضافه‌کاری ردشده`:''}${x.reasonCode?' · علت '+attReasonName(x.reasonCode):''}${x.reasonText?' — '+esc(x.reasonText):''}`).join(' ؛ ');

function plannedSessionWindow(date){const ap=inPersonAppointments(date);if(!ap.length)return null;const before=Math.max(0,+Store.cfg('secPayBeforeFirst',30)||0),after=Math.max(0,+Store.cfg('secPayAfterLast',30)||0);const start=Math.min(...ap.map(a=>hm(a.time||'00:00')))-before,end=Math.max(...ap.map(a=>hm(a.time||'00:00')+(+a.durationMinutes||60)))+after;return{start:Math.max(0,start),end:Math.min(1440,end),appointments:ap}}

function rawAttendanceMinutes(a,now=T()){if(!a?.in)return 0;const start=hm(a.in),date=String(a.date||''),end=a.out?hm(a.out):(date===now.key?hm(now.time):start);return Math.max(0,end-start)}
function attendanceEndForPolicy(a,now=T()){if(a?.out)return hm(a.out);const start=hm(a?.in||'00:00'),date=String(a?.date||'');if(date===now.key)return hm(now.time);const regular=shiftWindow(a.pid,date),session=completedSessionWindow(date)||plannedSessionWindow(date);return Math.max(start,regular?.end||0,session?.end||0)}

function boot(open){
 App.boot=({title,tabs})=>{
  tabs=orderTabs(tabs);const initial=tabs.find(t=>t.id===open)||tabs.find(t=>t.id==='dash')||tabs[0];

  document.body.innerHTML=`<header class="top"><div class="top-title-wrap"><h1>${esc(title)}<span class="sub" id="sectionLabel">${esc(initial.title)}</span></h1>${activeCenterName?`<div class="top-center-name" id="topCenterName" title="مرکز فعال برای نظارت">${esc(activeCenterName)}</div>`:''}</div><button class="theme-toggle" type="button" aria-label="تغییر به حالت روشن" title="حالت روشن"><span aria-hidden="true">☀️</span><span class="theme-toggle-label">روشن</span></button><button class="menu-trigger" id="topMenu" aria-label="باز کردن منوی بخش‌ها" title="منوی بخش‌ها">☰</button></header><main id="view"></main>`;try{if(window.CenterHub&&CenterHub.mountContext)CenterHub.mountContext()}catch(e){};document.documentElement.style.setProperty('--clinic-font-scale',String(Store.cfg('fontScale',1)));document.documentElement.style.setProperty('--clinic-calendar-scale',String(Store.cfg('calendarScale',1.15)));
  const view=$('#view');
  const go=id=>{const t=tabs.find(x=>x.id===id)||tabs[0];App.cur=t.id;const lab=$('#sectionLabel');if(lab)lab.textContent=t.title;view.style.opacity='0';view.innerHTML='';try{t.render(view)}catch(err){console.error(err);view.innerHTML='<div class="card"><b>خطا در نمایش این بخش</b><div class="mut">'+String(err.message||err)+'</div><button class="btn sec sm" id="retryView">تلاش مجدد</button></div>';const r=$('#retryView',view);if(r)r.onclick=()=>go(t.id)}requestAnimationFrame(()=>{view.style.transition='opacity .15s';view.style.opacity='1'})};
  App.goto=go;
  $('#topMenu').onclick=()=>{const html=tabs.map((t,i)=>`<div class="card row" data-menu-index="${i}" style="cursor:pointer;padding:14px"><div class="g"><b>${esc(t.icon)} ${esc(t.title)}</b></div><span class="mut">${t.id===App.cur?'●':'›'}</span></div>`).join('');sheet('منوی بخش‌ها',html,(b,c)=>$$('[data-menu-index]',b).forEach(item=>item.onclick=()=>{const t=tabs[+item.dataset.menuIndex];c();go(t.id)}))};
  App.refresh=()=>go(App.cur);go(initial.id);
 };
 App.boot({title:'پنل مدیریت',tabs:orderTabs(TABS)});
 if(open&&App.goto)App.goto(open);
}
boot();

<script>
/* ============================================================================
   لایهٔ «اتصال داده» میان سه برنامهٔ مستقل
   هر سه برنامه (مدیریت / منشی / ورود و خروج) برنامه‌های جداگانه‌اند و هیچ‌کدام
   راهی برای رفتن به برنامهٔ دیگر ندارند؛ فقط دادهٔ یک مرکز را مشترک می‌خوانند:

     ۱) تغییر داده: هر نوشتن در فضای ذخیرهٔ مشترک، به برنامه‌های دیگر اعلام
        می‌شود (BroadcastChannel + رویداد storage) و آن‌ها بدون بازخوانی صفحه
        همان داده را نمایش می‌دهند.
     ۲) حضور: هر برنامه هر چند ثانیه اعلام می‌کند که باز است؛ بنابراین می‌توان
        دید کدام برنامه‌ها همین حالا به داده متصل‌اند.
     ۳) وضعیت: نشان کوچک در نوار مرکز + شیت جزئیات (بدون هیچ پیوند جابه‌جایی).

   اگر مرورگر ذخیره‌سازی مشترک را مسدود کند (باز کردن فایل با file://)، برنامه
   تنها کار می‌کند و همین موضوع صریحاً نمایش داده می‌شود.
   ========================================================================= */
(function () {
  'use strict';

  var APP = window.CLINIC_SUITE_APP || window.CLINIC_PANEL_ROLE || 'app';
  var ORDER = ['admin', 'secretary', 'attendance'];
  var LABELS = {
    admin: 'پنل مدیریت',
    secretary: 'پنل منشی',
    attendance: 'ورود و خروج'
  };
  var ICONS = { admin: '🗂️', secretary: '🗓️', attendance: '⏱️' };

  var CHANNEL = 'clinic-connection';
  var PRESENCE_KEY = '__clinic_presence';   // عمداً با clinic شروع نمی‌شود تا محرک بازآرایی نشود
  var APPEARANCE_KEY = 'clinicAppearanceMode';
  var HEARTBEAT_MS = 5000;
  var STALE_MS = 13000;

  var instance = Math.random().toString(36).slice(2);
  var channel = null;
  var timer = null;
  var beatTimer = null;
  var pendingRepaint = false;
  var livePeers = {};
  var lastLabel = '';

  /* ---------- توانِ ذخیره‌سازی مشترک ------------------------------------- */
  function storageUsable() {
    try {
      window.localStorage.setItem('__clinic_probe__', '1');
      window.localStorage.removeItem('__clinic_probe__');
      return true;
    } catch (e) {
      return false;
    }
  }
  var fileMode = location.protocol === 'file:';
  var live = storageUsable() && !fileMode;

  /* ---------- حضور -------------------------------------------------------- */
  function readPresence() {
    try {
      var raw = window.localStorage.getItem(PRESENCE_KEY);
      var data = raw ? JSON.parse(raw) : {};
      return data && typeof data === 'object' ? data : {};
    } catch (e) {
      return {};
    }
  }

  function writePresence(map) {
    try { window.localStorage.setItem(PRESENCE_KEY, JSON.stringify(map)); } catch (e) {}
  }

  function beat() {
    if (!live) { renderStatus(); return; }
    var map = readPresence();
    map[APP] = Date.now();
    /* پاک‌سازی ورودی‌های کهنه تا کلید بزرگ نشود */
    Object.keys(map).forEach(function (id) {
      if (id !== APP && Date.now() - (map[id] || 0) > STALE_MS) delete map[id];
    });
    writePresence(map);
    post({ type: 'beat', app: APP });
    renderStatus();
  }

  function peers() {
    if (!live) return [];
    var map = readPresence();
    var now = Date.now();
    var out = [];
    ORDER.forEach(function (id) {
      if (id === APP) return;
      var at = Math.max(map[id] || 0, livePeers[id] || 0);
      if (at && now - at < STALE_MS) out.push({ id: id, at: at });
    });
    return out;
  }

  function leave() {
    if (!live) return;
    var map = readPresence();
    delete map[APP];
    writePresence(map);
    post({ type: 'bye', app: APP });
  }

  /* ---------- انتشار تغییرات --------------------------------------------- */
  function post(message) {
    if (!channel) return;
    try {
      message.from = instance;
      channel.postMessage(message);
    } catch (e) {}
  }

  var hasOverlay = function () { return !!document.querySelector('.ov'); };

  function repaint() {
    if (typeof Store === 'undefined') return;
    try { Store.refresh(); } catch (e) {}
    if (hasOverlay()) { pendingRepaint = true; return; }
    if (typeof App !== 'undefined' && typeof App.refresh === 'function') {
      try { App.refresh(); } catch (e) {}
    }
    flash();
  }

  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(repaint, 140);
  }

  if (!window.__clinicConnectionPatched) {
    window.__clinicConnectionPatched = true;
    try {
      var nativeSet = Storage.prototype.setItem;
      Storage.prototype.setItem = function (key, value) {
        nativeSet.call(this, key, value);
        var name = String(key);

      };
    } catch (e) {}
  }

    channel = new BroadcastChannel(CHANNEL);
    channel.addEventListener('message', function (event) {
      var data = event.data || {};
      if (!data.from || data.from === instance) return;
      if (data.type === 'change') { schedule(); return; }
      if (data.type === 'beat' && data.app) { livePeers[data.app] = Date.now(); renderStatus(); return; }

    });
  } catch (e) {
    channel = null;
  }

  window.addEventListener('storage', function (event) {
    var key = event.key || '';
    if (!key) { schedule(); renderStatus(); return; }
    if (key === PRESENCE_KEY) { renderStatus(); return; }
    if (key === APPEARANCE_KEY) return;
    if (key.indexOf('clinic') !== 0) return;
    schedule();
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { beat(); renderStatus(); }
  });
  window.addEventListener('pagehide', leave);
  window.addEventListener('pageshow', function (event) { if (event.persisted) beat(); });

  function watchOverlay() {
    if (!document.body || typeof MutationObserver === 'undefined') return;
    new MutationObserver(function () {

    }).observe(document.body, { childList: true, subtree: true });
  }

  /* ---------- نمایش وضعیت ------------------------------------------------ */
  var flashTimer = null;
  function flash() {
    var pill = document.querySelector('.sync-status');
    if (!pill || !live) return;
    pill.classList.add('is-flash');
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { pill.classList.remove('is-flash'); }, 700);
  }

  function cloud() {
    return window.ClinicCloud && window.ClinicCloud.enabled ? window.ClinicCloud.status() : null;
  }

  function labelFor(connected) {
    var c = cloud();
    if (c) {
      if (!c.active) return 'در انتظار لایسنس';
      var count = c.sessions ? c.sessions.length : 0;
      return count > 1 ? 'متصل · ' + count + ' دستگاه' : 'متصل';
    }
    if (!live) return 'بدون اتصال';
    if (connected >= 3) return '۳ برنامه متصل';
    if (connected === 2) return '۲ برنامه متصل';
    return 'فقط این برنامه';
  }

  function statusText() {
    var c = cloud();
    if (c) {
      if (!c.active) return 'این برنامه هنوز با لایسنس وصل نشده است؛ بدون لایسنس داده نمایش داده نمی‌شود.';
      return 'دادهٔ مرکز نگه‌داری می‌شود و تغییرها بین دستگاه‌های همین لایسنس جابه‌جا می‌شوند.';
    }
    if (!live) {
      return fileMode
        ? 'این برنامه مستقیم از فایل باز شده است؛ برای اتصال داده به دو برنامهٔ دیگر، آن را از سرور محلی یا دامنهٔ مشترک باز کنید.'
        : 'مرورگر ذخیره‌سازی مشترک را مسدود کرده است؛ دادهٔ این برنامه با برنامه‌های دیگر همگام نمی‌شود.';
    }
    return 'دادهٔ این برنامه با برنامه‌های متصل، زنده به‌اشتراک گذاشته می‌شود.';
  }

  function renderStatus() {
    var bar = document.querySelector('.center-context');
    if (!bar) return;
    var pill = bar.querySelector('.sync-status');
    if (!pill) {
      pill = document.createElement('button');
      pill.type = 'button';
      pill.className = 'sync-status';
      pill.addEventListener('click', openStatus);
      bar.appendChild(pill);
    }
    var list = peers();
    var connected = 1 + list.length;
    var c = cloud();
    var state = c
      ? (c.active ? 'server' : 'pending')
      : (!live ? 'solo' : list.length ? 'connected' : 'alone');
    var label = labelFor(connected);
    if (pill.dataset.state !== state || pill.dataset.label !== label) {
      pill.dataset.state = state;
      pill.dataset.label = label;
      pill.classList.toggle('is-offline', state === 'solo' || state === 'pending' || state === 'alone');
      pill.innerHTML = '<span class="sync-dot" aria-hidden="true"></span><span class="sync-label">' + label + '</span>';
      pill.setAttribute('aria-label', 'وضعیت اتصال داده: ' + label);
    }
    pill.title = statusText();
    lastLabel = label;
  }

  function cloudBlock(c) {
    if (!c) return '';
    if (!c.active) {
      return '<div class="conn-row is-off"><span class="conn-icon" aria-hidden="true">🔒</span>' +
        '<span class="conn-name"><b>متصل نشده</b><small>برای اتصال، کلید لایسنس را وارد کنید</small></span>' +
        '<button type="button" class="btn sm" data-cloud-login>اتصال</button></div>';
    }
    var license = c.license || {};
    var expiry = license.expires_at ? new Date(license.expires_at).toLocaleDateString('fa-IR') : 'بدون محدودیت';
    return '<div class="conn-row is-on"><span class="conn-icon" aria-hidden="true">☁️</span>' +
      '<span class="conn-name"><b>' + (c.center ? c.center.name : 'مرکز') + '</b>' +
      '<small>اعتبار لایسنس تا ' + expiry + ' · نسخهٔ داده ' + c.revision + '</small></span>' +
      '<span class="conn-dot" aria-hidden="true"></span></div>' +
      '<div class="conn-row ' + (c.error ? 'is-off' : 'is-on') + '"><span class="conn-icon" aria-hidden="true">' + (c.error ? '⚠️' : '✅') + '</span>' +
      '<span class="conn-name"><b>' + (c.error ? 'خطا در همگام‌سازی' : 'همگام‌سازی سالم') + '</b>' +
      '<small>' + (c.error ? c.error : (c.pending ? c.pending + ' تغییر در صف ارسال' : 'همهٔ تغییرها روی سرور ذخیره شده‌اند')) + '</small></span>' +
      '<span class="conn-dot" aria-hidden="true"></span></div>';
  }

  function cloudDevices(c) {
    if (!c || !c.active || !c.sessions || !c.sessions.length) return '';
    var rows = c.sessions.map(function (item) {
      return '<div class="conn-row is-on"><span class="conn-icon" aria-hidden="true">' + (ICONS[item.panel] || '•') + '</span>' +
        '<span class="conn-name"><b>' + (LABELS[item.panel] || item.panel) + (item.is_current ? ' · همین دستگاه' : '') + '</b>' +
        '<small>' + (item.device || 'دستگاه') + ' · ' + Math.max(1, Math.round((Date.now() - Date.parse(item.last_seen)) / 1000)) + ' ثانیه پیش</small></span>' +
        '<span class="conn-dot" aria-hidden="true"></span></div>';
    }).join('');
    return '<h4 style="margin:14px 2px 8px;font-size:12.5px">دستگاه‌های متصل</h4><div class="conn-list">' + rows + '</div>';
  }

  function statusHtml() {
    var c = cloud();
    if (c) {
      return '<div class="conn-list">' + cloudBlock(c) + '</div>' + cloudDevices(c) +
        '<p class="conn-note">' + statusText() + '</p>' +
        '<p class="conn-note">هر برنامه مستقل نصب می‌شود؛ اتصال آن‌ها فقط از راه لایسنس همین مرکز و دیتابیس روی سرور است.</p>' +
        (c.active ? '<button type="button" class="btn sec big" id="cloudLogout">قطع اتصال این دستگاه</button>' : '') +
        '<button type="button" class="btn big" id="connClose">بستن</button>';
    }
    var list = peers();
    var byId = {};
    list.forEach(function (peer) { byId[peer.id] = peer.at; });
    var rows = ORDER.map(function (id) {
      var self = id === APP;
      var at = byId[id];
      var state = self ? 'همین برنامه' : at ? 'متصل' : (live ? 'بسته' : 'نامشخص');
      var tone = self ? 'is-self' : at ? 'is-on' : 'is-off';
      var when = at ? ' · آخرین فعالیت ' + Math.max(1, Math.round((Date.now() - at) / 1000)) + ' ثانیه پیش' : '';
      return '<div class="conn-row ' + tone + '">' +
        '<span class="conn-icon" aria-hidden="true">' + (ICONS[id] || '•') + '</span>' +
        '<span class="conn-name"><b>' + (LABELS[id] || id) + '</b><small>' + state + when + '</small></span>' +
        '<span class="conn-dot" aria-hidden="true"></span>' +
        '</div>';
    }).join('');

    return '<div class="conn-list">' + rows + '</div>' +
      '<p class="conn-note">' + statusText() + '</p>' +
      '<p class="conn-note">این سه برنامه کاملاً مستقل نصب و اجرا می‌شوند؛ فقط دادهٔ مرکز را با هم به اشتراک می‌گذارند. برای اتصال، باید روی یک دامنه (یا یک سرور محلی) باز شوند.</p>' +
      '<button type="button" class="btn big" id="connClose">بستن</button>';
  }

  function openStatus() {
    if (typeof sheet !== 'function') return;
    sheet('اتصال داده', statusHtml(), function (box, close) {
      var button = box.querySelector('#connClose');
      if (button) button.onclick = close;
      var logout = box.querySelector('#cloudLogout');
      if (logout) logout.onclick = function () { close(); window.ClinicCloud.logout(); };
      var connect = box.querySelector('[data-cloud-login]');
      if (connect) connect.onclick = function () { close(); window.ClinicCloud.openGate(); };
    });
  }

  function boot() {
    watchOverlay();
    beat();
    clearInterval(beatTimer);
    beatTimer = setInterval(beat, HEARTBEAT_MS);
    if (typeof MutationObserver !== 'undefined' && document.body) {
      new MutationObserver(renderStatus).observe(document.body, { childList: true, subtree: true });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, { once: true });
  } else {
    boot();
  }

  window.ClinicConnection = {
    panel: APP,
    isLive: function () { return live; },
    peers: function () { return peers().map(function (peer) { return peer.id; }); },
    connectedCount: function () { return 1 + peers().length; },
    label: function () { return lastLabel; },
    status: function () {
      return { live: live, fileMode: fileMode, panel: APP, peers: peers().map(function (p) { return p.id; }) };
    },
    open: openStatus,
    paint: renderStatus,
    refresh: schedule
  };
})();
</script>
<script>
/* ============================================================================
   راه‌اندازی هر برنامه به‌صورت مستقل
   — پیوند مستقیم به یک بخش از همین برنامه:  ?tab=<id>
   — ثبت سرویس‌ورکر همین برنامه برای اجرای آفلاین
   — دکمهٔ «نصب» وقتی مرورگر امکان نصب این برنامه را بدهد
   هیچ‌کدام از این‌ها ارتباطی با برنامه‌های دیگر ندارد.
   ========================================================================= */
(function () {
  'use strict';

  var tab = new URLSearchParams(window.location.search).get('tab');
  if (tab && typeof App !== 'undefined' && typeof App.goto === 'function') {
    try { App.goto(tab); } catch (e) {}
  }

  /* ---------- برداشتن صفحهٔ راه‌اندازی ----------------------------------- */
  function hideSplash() {
    var splash = document.getElementById('appSplash');
    if (!splash || splash.classList.contains('is-hiding')) return;
    splash.classList.add('is-hiding');
    setTimeout(function () { splash.classList.add('is-done'); }, 320);
  }

  function whenReady() {
    if (document.querySelector('header.top')) { hideSplash(); return; }
    if (typeof MutationObserver === 'undefined') { hideSplash(); return; }
    var observer = new MutationObserver(function () {
      if (document.querySelector('header.top')) { observer.disconnect(); hideSplash(); }
    });
    observer.observe(document.body, { childList: true, subtree: true });
    setTimeout(function () { observer.disconnect(); hideSplash(); }, 4000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', whenReady, { once: true });
  } else {
    whenReady();
  }

  /* ---------- سرویس‌ورکر: آفلاین و نصب‌پذیری همین برنامه ------------------ */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function () {});
    });
  }

  /* ---------- دکمهٔ نصب، فقط اگر مرورگر اجازه بدهد ------------------------ */
  var promptEvent = null;
  var installed = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

  function mountInstall() {
    var header = document.querySelector('header.top');
    if (!header || installed || !promptEvent) return;
    if (header.querySelector('#appInstall')) return;
    var button = document.createElement('button');
    button.type = 'button';
    button.id = 'appInstall';
    button.className = 'menu-trigger app-install-trigger';
    button.setAttribute('aria-label', 'نصب این برنامه روی دستگاه');
    button.setAttribute('title', 'نصب این برنامه');
    button.textContent = '⬇';
    button.addEventListener('click', function () {
      if (!promptEvent) return;
      promptEvent.prompt();
      promptEvent.userChoice.then(function () { promptEvent = null; button.remove(); }).catch(function () {});
    });
    header.appendChild(button);
  }

  window.addEventListener('beforeinstallprompt', function (event) {
    event.preventDefault();
    promptEvent = event;
    mountInstall();
  });
  window.addEventListener('appinstalled', function () {
    installed = true;
    var button = document.querySelector('#appInstall');
    if (button) button.remove();
  });

  if (typeof MutationObserver !== 'undefined' && document.body) {
    new MutationObserver(mountInstall).observe(document.body, { childList: true, subtree: true });
  }
})();
</script>

  psychclub:['باشگاه روانشناسی','عضویت‌ها، برنامه‌ها و پرداخت‌ها','cap'],
  expenses:['هزینه‌های من','ثبت و مرور هزینه‌های شخصی مرکز','receipt'],
  tx:role==='admin'?['مالی','تراکنش‌ها، بدهی‌ها و گزارش مالی مرکز','wallet']:['تراکنش‌ها','ثبت و مرور دریافتی‌ها و هزینه‌ها','wallet'],
  sms:['پیامک','ارسال پیامک تکی و گروهی و یادآوری نوبت','chat'],
  plans:['طرح‌های درمانی','طرح‌های سازمانی و مبلغ ثابت جلسات','clip'],
  welfare:['مطالبات بهزیستی','پیگیری مطالبات و تخفیف‌های بهزیستی','heart'],
  staff:['تنظیمات منشی‌ها','شیفت‌ها، دسترسی‌ها و ساعت کاری منشی‌ها','sliders'],
  cal:['برنامه‌ها','نوبت‌ها و برنامهٔ همهٔ درمانگران','cal'],
  centers:['مراکز','مراکز فعال و اتصال پنل‌ها','build']
 };
 var AV_TABS={people:1,ther:1};
 var lastCur=null,enterT=0,pending=false;

 function heroFor(cur){
  var m=META[cur];if(!m)return null;
  var h=document.createElement('div');h.className='v4-hero';h.dataset.t=cur;
  h.innerHTML='<div class="ic">'+S(IC[m[2]]||IC.gear)+'</div><div class="tx"><b></b><span></span></div>';
  h.querySelector('b').textContent=m[0];h.querySelector('span').textContent=m[1];
  return h;
 }
 function initial(name){
  name=String(name||'').replace(/^(دکتر|خانم|آقای|آقا|استاد)\s+/,'').trim();
  var c=name.charAt(0);return c||'•';
 }
 function decorateAvatars(v,cur){
  if(!AV_TABS[cur])return;
  v.querySelectorAll('.lst>.card.row[data-id]').forEach(function(r){
   if(r.querySelector(':scope>.v4-av'))return;
   var b=r.querySelector('.g b');if(!b)return;
   var a=document.createElement('span');a.className='v4-av';a.setAttribute('aria-hidden','true');a.textContent=initial(b.textContent);
   r.insertBefore(a,r.firstChild);
  });
 }
 function run(){
  pending=false;
  var a=gA(),v=document.getElementById('view');if(!a||!v)return;
  var cur=a.cur;
  document.documentElement.setAttribute('data-page',cur===HOME?'home':'inner');
  document.documentElement.setAttribute('data-tab',cur||'');
  document.querySelectorAll('.ov:not(.v4-drawer)').forEach(function(o){if(o.querySelector('[data-menu-index]'))o.classList.add('v4-drawer')});
  var ex=v.querySelector(':scope>.v4-hero');
  if(!META[cur]||SKIP[cur]||cur===HOME){if(ex)ex.remove()}
  else if(!ex||ex.dataset.t!==cur){if(ex)ex.remove();var h=heroFor(cur);if(h)v.insertBefore(h,v.firstChild)}
  decorateAvatars(v,cur);
  if(cur!==lastCur){
   lastCur=cur;v.classList.add('v4-enter');clearTimeout(enterT);enterT=setTimeout(function(){v.classList.remove('v4-enter')},450);
  }
 }
 function schedule(){if(pending)return;pending=true;(window.requestAnimationFrame||setTimeout)(run)}
 new MutationObserver(schedule).observe(document.body,{childList:true,subtree:true});
 setInterval(schedule,1500);schedule();
})();

</script>
